# Deploys the storefront to GitHub Pages on every push to main.
# Static hosting runs the store in demo mode (see SETUP.md):
# products + cart + checkout work; admin/uploads/accounts need the backend.
name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Served from a custom apex domain (see frontend/public/CNAME), so the
      # site lives at "/" — build with the default base. If you ever go back
      # to the <user>.github.io/<repo>/ project URL, set BASE_PATH to
      # /${{ github.event.repository.name }} here instead.
      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Configure Pages (creates the site on first deploy)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
